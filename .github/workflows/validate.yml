name: validate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate

  release:
    needs: main
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'safethecode/mdx-bundler-secure' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@12
      - run: npm ci
      - run: npm run build && npm run test:package
      - name: Publish the verified tag using npm trusted publishing
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          test "v${package_version}" = "$GITHUB_REF_NAME"
          if npm view "${package_name}@${package_version}" version > /dev/null 2>&1; then
            test "$(npm view "${package_name}@${package_version}" gitHead)" = "$GITHUB_SHA"
            echo "This commit is already published."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
